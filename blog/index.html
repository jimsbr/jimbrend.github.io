<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blog — jim</title>
<meta name="description" content="Snapshots of the machine economy and whatever else compiles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---- phase 1: bright cyan pixels against deep black ---- */
  :root{
    --cy:#00f6ff;       /* bright cyan */
    --cy2:#7dffea;
    --deep:#000203;     /* deep black */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    background-color:var(--deep);
    background-image:
      radial-gradient(rgba(0,246,255,.22) 1px, transparent 1.6px),
      radial-gradient(rgba(125,255,234,.10) 1px, transparent 1.6px);
    background-size:22px 22px, 34px 34px;
    background-position:0 0, 11px 17px;
    color:var(--cy2);
    font-family:'IBM Plex Mono', monospace;
    transition:background-color 3.5s ease, color 3.5s ease, background-image 3.5s ease;
    padding:6vh 24px 12vh;
  }
  .wrap{max-width:760px;margin:0 auto}
  .home{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
  h1{
    font-weight:700;
    font-size:clamp(6rem, 24vw, 17rem);   /* the word, very large */
    line-height:.95;
    color:var(--cy);
    text-shadow:0 0 24px rgba(0,246,255,.5), 0 0 90px rgba(0,246,255,.25);
    letter-spacing:-.02em;
    margin:.5rem 0 4vh;
    transition:font-size 3.5s ease, color 3.5s ease, text-shadow 3.5s ease, letter-spacing 3.5s ease;
  }
  h2{font-size:1rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cy);margin:3rem 0 1.2rem;transition:all 3.5s ease}
  ul{list-style:none;transition:all 3.5s ease}
  li{padding:.55rem 0;font-size:1rem;line-height:1.6}
  .d{color:rgba(125,255,234,.55);margin-right:1rem;font-size:.85rem;transition:color 3.5s ease}
  a{color:var(--cy);text-decoration:none;transition:color 3.5s ease}
  a:hover{text-decoration:underline}
  .foot{margin-top:9vh;font-size:.78rem;color:rgba(125,255,234,.5);transition:color 3.5s ease}
  .foot a{color:rgba(125,255,234,.7)}
  .hint{font-size:.7rem;letter-spacing:.18em;color:rgba(0,246,255,.45);margin-top:2rem;transition:opacity 2s ease}

  /* ---- phase 2: the formatting times out ---- */
  body.decayed{
    background-color:#fdfdfd;
    background-image:none;
    color:#111;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body.decayed h1{
    font-size:1.9rem;
    color:#111;
    text-shadow:none;
    letter-spacing:0;
    font-weight:600;
  }
  body.decayed h2{color:#111;letter-spacing:0;text-transform:none;font-size:1.15rem}
  body.decayed ul{list-style:disc;padding-left:1.4rem}
  body.decayed .d{color:#828282}
  body.decayed a{color:#2a7ae2}
  body.decayed .foot{color:#828282}
  body.decayed .foot a{color:#2a7ae2}
  body.decayed .hint{opacity:0}
  body.decayed .home a{color:#111}

  @media (prefers-reduced-motion: reduce){
    body, h1, h2, ul, a, .d, .foot, .hint{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="home"><a href="../">← jim</a></p>
  <h1>blog</h1>

  <h2>Posts</h2>
  <ul>
    <li><span class="d">Jul 24, 2026</span><a href="./lilacs-out-of-the-dead-land-pt-2/">Lilacs out of the dead land, Pt. 2</a></li>
    <li><span class="d">Jul 24, 2026</span><a href="./AquaReview/">Aqua — an X article, reshared</a></li>
    <li><span class="d">earlier</span><a href="https://jimsbr.github.io/XarticleTestWithMedia/">X article test, with media</a></li>
  </ul>

  <p class="hint">// formatting will now time out on its own…</p>

  <p class="foot">
    jim · <a href="https://x.com/jimsbr">@jimsbr</a> · full versions on <a href="https://jimsuley.substack.com">substack</a><br>
    a student of singularities that are all getting nearer
  </p>
</div>

<script>
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce){ document.body.classList.add('decayed'); return; }
    // hold the cyan-pixel phase, then let the formatting slowly decay away
    setTimeout(function(){ document.body.classList.add('decayed'); }, 4000);
  })();
</script>
</body>
</html>
